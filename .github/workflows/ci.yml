name: CI

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

env:
  FOUNDRY_PROFILE: default

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        # Pin versions to match local dev (OZ 5.6.1). Floating master was
        # pulling an incompatible OZ Upgradeable that dropped
        # __UUPSUpgradeable_init, breaking Settlement.sol CI builds.
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --no-git
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.6.1 --no-git
          forge install pyth-network/pyth-sdk-solidity@v4.0.0 --no-git
          forge install foundry-rs/forge-std@v1.9.7 --no-git
      - run: forge fmt --check
      - run: forge build
      - run: forge test -vvv

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
